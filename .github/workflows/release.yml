name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-release-artifacts:
    runs-on: windows-2025

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $version = '6.7.3'
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$version.exe"
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-$version.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $expectedHash = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup installer hash verification failed."
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }

      - name: Read project version
        id: project-version
        shell: pwsh
        run: |
          $projectVersion = (dotnet msbuild .\src\QuietShelf.App\QuietShelf.App.csproj -nologo -getProperty:Version).Trim()
          "value=$projectVersion" >> $env:GITHUB_OUTPUT

      - name: Verify tag matches project version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $projectVersion = '${{ steps.project-version.outputs.value }}'
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($tagVersion -ne $projectVersion) {
            throw "Tag version '$tagVersion' does not match project version '$projectVersion'."
          }

      - name: Restore locked dependencies
        run: |
          dotnet restore .\QuietShelf.slnx --locked-mode
          dotnet restore .\src\QuietShelf.App\QuietShelf.App.csproj --locked-mode -r win-x64 -p:PublishSingleFile=false -p:SelfContained=false

      - name: Build and test tagged source
        run: |
          dotnet build .\QuietShelf.slnx --no-restore -c Release
          dotnet test .\QuietShelf.slnx --no-build -c Release --filter "Category!=Manual&Category!=LocalData"

      - name: Build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -NoRestore

      - name: Assemble release bundle
        shell: pwsh
        run: |
          $version = (dotnet msbuild .\src\QuietShelf.App\QuietShelf.App.csproj -nologo -getProperty:Version).Trim()
          $releaseDirectory = Join-Path $PWD 'artifacts\release'
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          Compress-Archive -Path '.\artifacts\win-x64\*' -DestinationPath (Join-Path $releaseDirectory "QuietShelf-$version-win-x64.zip")
          Copy-Item -LiteralPath ".\artifacts\installer\Yiye-Setup-$version.exe" -Destination $releaseDirectory

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: QuietShelf-${{ steps.project-version.outputs.value }}-${{ github.run_number }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30
