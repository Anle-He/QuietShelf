name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Restore locked dependencies
        run: dotnet restore .\QuietShelf.slnx --locked-mode

      - name: Build
        run: dotnet build .\QuietShelf.slnx --no-restore -c Release

      - name: Test
        run: dotnet test .\QuietShelf.slnx --no-build -c Release --filter "Category!=Manual"
